# Development stack. Run via the Makefile (it passes --env-file .env and the right profiles):
#   make up            -> core: postgres, redis, objectstore
#   make up-streaming  -> core + kafka, kafka-ui
#   make up-apps       -> core + backend, frontend, ai-service
# All published ports bind to 127.0.0.1 only. Image tags are version lines; pin by digest
# before any shared or production use (see docs/deployment.md).
name: realtime-chat

services:
  postgres:
    profiles: ["core"]
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?run make env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make env}
      POSTGRES_DB: ${POSTGRES_DB:?run make env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 images expect the mount at /var/lib/postgresql (versioned PGDATA inside).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    profiles: ["core"]
    image: redis:8.6
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?run make env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?run make env}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  # S3-compatible object storage. MinIO is NOT used: its community edition is archived (ADR-008).
  # Dev mode runs without S3 credentials and is reachable from localhost only.
  objectstore:
    profiles: ["core"]
    image: chrislusf/seaweedfs:latest   # TODO(phase-1-verify): replace with a pinned version/digest
    command: ["server", "-s3", "-dir=/data", "-ip=objectstore", "-master.volumeSizeLimitMB=256"]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - objectstore-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  kafka:
    profiles: ["streaming"]
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kafka-ui:
    profiles: ["streaming"]
    image: ghcr.io/kafbat/kafka-ui:latest   # TODO(phase-1-verify): replace with a pinned version/digest
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  backend:
    profiles: ["apps"]
    build:
      context: ../../backend
    environment:
      APP_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?run make env}
      # Optional dependencies: reported by /readyz, never fail readiness.
      KAFKA_BROKERS: kafka:9092
      OBJECT_STORE_ADDR: objectstore:8333
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/api", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    profiles: ["apps"]
    build:
      context: ../../frontend
    environment:
      VITE_API_PROXY: http://backend:8080
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  ai-service:
    profiles: ["apps"]
    build:
      context: ../../ai-service
    environment:
      APP_ENV: development
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  objectstore-data:
  kafka-data:
