# PRODUCTION TEMPLATE. Not runnable as-is and not used by the Makefile.
# Assumptions: PostgreSQL, Redis, Kafka and object storage are managed or deployed separately
# (decided in Phase 8); this file only shows hardened settings for the application containers.
# Copy to a private location, replace every <PLACEHOLDER>, and pin images by digest.
name: realtime-chat-prod

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]

services:
  backend:
    <<: *hardening
    image: <REGISTRY>/realtime-chat-backend@sha256:<DIGEST>
    env_file: <PATH_TO_SECRET_ENV_FILE>   # provided by your secret manager; never committed
    environment:
      APP_ENV: production                 # rejects sslmode=disable for DATABASE_URL
      LOG_FORMAT: json
      LOG_LEVEL: info
      HTTP_ADDR: ":8080"
    healthcheck:
      test: ["CMD", "/app/api", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    stop_grace_period: 30s

  ai-service:
    <<: *hardening
    image: <REGISTRY>/realtime-chat-ai@sha256:<DIGEST>
    env_file: <PATH_TO_SECRET_ENV_FILE>
    environment:
      APP_ENV: production
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
    stop_grace_period: 30s

# The frontend is served as static files from a CDN or reverse proxy in production.
