[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-chat-ai-service"
version = "0.1.0"
description = "Asynchronous AI service (never on the message delivery path)"
requires-python = ">=3.12"
# Versions are resolved at `make ai-deps` and recorded in requirements*.lock (commit those).
dependencies = [
  "fastapi",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "httpx",
  "ruff",
  "mypy",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
